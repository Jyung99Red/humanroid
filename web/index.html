<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>人形训练回放</title>
<style>
  :root { --bg:#0e1420; --panel:rgba(16,22,34,.78); --line:rgba(255,255,255,.14); --tx:#e8eef7; --dim:#9fb0c7; --acc:#ffb347; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--tx); font:14px/1.4 system-ui, "Microsoft YaHei", sans-serif; overflow:hidden; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .panel { position:fixed; background:var(--panel); border:1px solid var(--line); border-radius:12px; backdrop-filter:blur(8px); }
  #top { top:12px; left:12px; padding:10px 14px; max-width:min(420px, calc(100vw - 24px)); }
  #top h1 { margin:0 0 6px; font-size:15px; font-weight:600; letter-spacing:.02em; }
  #runs { display:flex; flex-wrap:wrap; gap:6px; }
  #runs label { display:flex; align-items:center; gap:5px; padding:3px 9px; border:1px solid var(--line); border-radius:999px; cursor:pointer; color:var(--dim); user-select:none; }
  #runs label.on { color:var(--tx); border-color:var(--acc); background:rgba(255,179,71,.14); }
  #runs input { display:none; }
  #hint { color:var(--dim); font-size:12px; margin-top:6px; }
  #side { top:12px; right:12px; padding:8px; width:min(250px, 44vw); max-height:calc(100vh - 110px); overflow:auto; }
  .lane { display:grid; grid-template-columns:10px 1fr auto; gap:8px; align-items:center; padding:5px 6px; border-radius:8px; }
  .lane .chip { width:10px; height:10px; border-radius:50%; }
  .lane .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lane .st { color:var(--dim); font-variant-numeric:tabular-nums; font-size:12px; }
  .lane.out .nm, .lane.out .st { opacity:.5; }
  .lane.out .st::before { content:"摔倒 · "; color:#ff7b72; }
  #bar { left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom, 0px)); padding:10px 14px; display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; }
  #bar button, #bar select { background:rgba(255,255,255,.08); color:var(--tx); border:1px solid var(--line); border-radius:8px; padding:6px 12px; font:inherit; cursor:pointer; }
  #bar button:hover, #bar select:hover { border-color:var(--acc); }
  #scrub { flex:1 1 220px; min-width:140px; accent-color:var(--acc); }
  #time { font-variant-numeric:tabular-nums; color:var(--dim); min-width:92px; text-align:right; }
  #tl { flex:1 1 100%; display:flex; flex-wrap:wrap; gap:8px 10px; align-items:center; padding-bottom:8px; border-bottom:1px solid var(--line); }
  #tl .k { color:var(--dim); }
  #tlScrub { flex:1 1 220px; min-width:140px; accent-color:#7cc4ff; }
  #tlInfo { font-variant-numeric:tabular-nums; min-width:150px; }
  #tlInfo b { color:#7cc4ff; font-weight:600; }
  #runs label .tlmark { color:#7cc4ff; font-size:12px; }
  #msg { position:fixed; inset:0; display:none; place-items:center; text-align:center; color:var(--dim); padding:24px; }
  [hidden] { display:none !important; }
  @media (max-width:640px) { #side { display:none; } #top { max-height:38vh; overflow:auto; } }
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg"></div>
<div class="panel" id="top">
  <h1>人形训练回放</h1>
  <div id="runs"></div>
  <div id="hint">勾选多个训练阶段可以同台对比 · 空格 播放/暂停 · ←/→ 快退/快进 · 时间线：拖"轮数"或按 ↑/↓ 换快照 · 鼠标拖动旋转，滚轮缩放</div>
</div>
<div class="panel" id="side"></div>
<div class="panel" id="bar">
  <div id="tl" hidden>
    <span class="k">轮数</span>
    <button id="tlPrev" aria-label="上一个快照">◀</button>
    <input id="tlScrub" type="range" min="0" max="0" value="0" aria-label="训练轮数">
    <button id="tlNext" aria-label="下一个快照">▶</button>
    <span id="tlInfo"></span>
  </div>
  <button id="play">暂停</button>
  <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="时间轴">
  <span id="time">0.00 / 0.00 s</span>
  <select id="speed" aria-label="速度"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
  <select id="cam" aria-label="镜头"><option value="follow">跟拍</option><option value="free">自由</option></select>
  <button id="closeup">特写</button>
  <button id="wide">全景</button>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const LANE = 1.7;                                  // 跑道宽度(米)
const SHIRTS = [0xe5484d, 0x3e8bff, 0x2fbf71, 0xf5a524, 0x9b6bff, 0x14b8c4, 0xff6fae, 0x8bc34a];

// ---------- 场景 ----------
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
function skyTexture() {
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#5b8fd1'); gr.addColorStop(.55, '#a9c9ea'); gr.addColorStop(1, '#e8eef2');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
scene.background = skyTexture();
scene.fog = new THREE.Fog(0xcfdcea, 28, 110);

const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 400);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 2; controls.maxDistance = 60;

scene.add(new THREE.HemisphereLight(0xe4f0ff, 0x6e7a58, 1.05));
const sun = new THREE.DirectionalLight(0xfff0dc, 2.4);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004;
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 60 });
scene.add(sun, sun.target);

function groundTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#7d9a68'; g.fillRect(0, 0, 256, 256);
  g.fillStyle = '#86a46f'; g.fillRect(0, 0, 128, 128); g.fillRect(128, 128, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(100, 100); t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ map: groundTexture(), roughness: 0.96 }));
ground.receiveShadow = true; scene.add(ground);

// MuJoCo 是 Z 轴朝上, three.js 是 Y 轴朝上: 整个机器人放进一个绕 X 轴转 -90° 的组里
const mj = new THREE.Group(); mj.rotation.x = -Math.PI / 2; scene.add(mj);
const deco = new THREE.Group(); scene.add(deco);          // 跑道、标线、文字(three 坐标系)

function textSprite(text, color = '#ffffff', size = 64) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 128;
  const g = c.getContext('2d'); g.font = `700 ${size}px "Microsoft YaHei", system-ui, sans-serif`;
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineWidth = 10; g.strokeStyle = 'rgba(0,0,0,.55)';
  g.strokeText(text, 256, 64); g.fillStyle = color; g.fillText(text, 256, 64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false }));
  s.scale.set(2.4, 0.6, 1); return s;
}

// ---------- 回放数据 ----------
let index = [], runs = [], selected = [];
let time = 0, playing = !params.has('pause'), total = 1;
const tmpQ0 = new THREE.Quaternion(), tmpQ1 = new THREE.Quaternion();

const runCache = new Map();                          // 来回切换回放时不用重新下载轨迹
async function loadRun(file) {
  if (runCache.has(file)) return runCache.get(file);
  const r = await fetch('replays/' + file + '?v=' + Date.now());
  if (!r.ok) throw new Error(file + ' 加载失败 (' + r.status + ')');
  const d = await r.json();
  if (d.type === 'timeline') {                     // 时间线: 只有清单, 每个快照的轨迹按需下载(snapIdx 指当前显示的快照)
    d.timeline = true; d.dir = file.slice(0, file.lastIndexOf('/') + 1); d.cap = d.steps;
    d.meta = { label: d.label, dt: d.dt }; d.snapIdx = -1; d.worlds = null;
  }
  runCache.set(file, d); return d;
}

// 时间线的快照: .bin 按世界依次是 位置 int16(毫米)、朝向 int16(×32767)、前进速度 int16(毫米/秒)、两脚接触 uint8(见 export_timeline.py)
const snapBufs = new Map();                          // url -> Promise<ArrayBuffer>, 拖滑块来回看时不重复下载
function snapBuf(d, i) {
  const url = 'replays/' + d.dir + d.snaps[i].file + '?v=' + d.version;
  if (!snapBufs.has(url)) snapBufs.set(url, fetch(url).then((r) => { if (!r.ok) throw new Error(url + ' 加载失败 (' + r.status + ')'); return r.arrayBuffer(); }));
  return snapBufs.get(url);
}
async function loadSnap(d, i) {
  const buf = await snapBuf(d, i), nb = d.bodies.length, sc = d.scale, worlds = [];
  let off = 0;
  const take = (len, k) => { const a = new Int16Array(buf, off, len), f = new Float32Array(len); for (let j = 0; j < len; j++) f[j] = a[j] / k; off += len * 2; return f; };
  for (const w of d.snaps[i].worlds) {
    const n = w.n, xpos = take(n * nb * 3, sc.pos), xquat = take(n * nb * 4, sc.quat), vx = take(n, sc.vx);
    const contact = new Uint8Array(buf, off, n * 2); off += n * 2;
    worlds.push({ n, fell: w.fell, xpos, xquat, vx, contact });
  }
  return worlds;
}
function prefetch(d) { let p = Promise.resolve(); d.snaps.forEach((_, i) => { p = p.then(() => snapBuf(d, i)).catch(() => {}); }); }   // 后台按顺序把所有快照下载好

// ---------- 造型参数(只影响外观, 和物理、训练完全无关)。想改造型就改这里的数, 刷新页面生效 ----------
const LOOK = {
  headSize: 0.132, headLift: 0.034, neckRadius: 0.048, eyeScale: 1.25,          // 头的半径, 头抬高多少(= 脖子长度), 脖子半径, 眼睛大小(倍数)
  shoulderLevel: 0.0, shoulderSpan: 0.33, shoulderSize: 0.052,                  // 肩头的高度(越小肩越低, 物理转轴在 0.06), 两肩头的距离, 肩头的半径
  chestWidth: 0.152, chestDepth: 0.094, chestHeight: 0.17, waistWidth: 0.138, hipWidth: 0.158,   // 胸的半宽/半厚/向下延伸多少, 腰和胯的半宽
  armThick: 1.0, legThick: 1.0, sleeve: 0.55, handSize: 0.045, footSize: 1.0,   // 手臂/腿的粗细(倍数), 袖子盖住上臂的比例(1 = 到肘), 手的大小, 鞋的大小(倍数)
  outline: 0.011,                                                               // 描边粗细(0 = 不描边)
  skin: '#f3d9be', hair: '#3a2a22', pants: '#2b3445', shoes: '#f2f2f2',         // 衣服的颜色按跑道区分(SHIRTS)
};
const ARM_REST = 0.28;                              // 上臂建模时的长度, 每帧按肩头到肘的实际距离拉伸(见 updateLinks)
const SPINE_REST = [[0, 0, 0], [-0.01, 0, -0.26], [-0.01, 0, -0.425]];   // 站直时 torso / waist_lower / pelvis 的原点在躯干坐标系里的位置(来自 humanoid.xml), 躯干蒙皮的绑定姿势
const Z_AXIS = new THREE.Vector3(0, 0, 1), D2R = Math.PI / 180;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };   // x = a 时为 0, x = b 时为 1, 中间平滑

// 几何体按参数缓存: 同一次构建里所有人形共用同一份, 重建时统一释放
let GEO = new Map();
const memo = (key, make) => { let g = GEO.get(key); if (!g) { g = make(); GEO.set(key, g); } return g; };
// 沿 z 轴的一段肢体: radii 是从近端(-z)到远端(+z)等距的几个半径, 中间平滑过渡, 两端是半球, 球心相距 2*half。
// cut < 1 时只做近端的一截并在 cut 处收口(袖子); pad 是比 radii 粗出来的量
function limbGeo(radii, half, cut = 1, pad = 0) {
  return memo(`lg${radii}|${half}|${cut}|${pad}`, () => {
    const curve = new THREE.SplineCurve(radii.map((r, i) => new THREE.Vector2(r + pad, -half + 2 * half * i / (radii.length - 1))));
    const pts = [], N = 8, r0 = radii[0] + pad, r1 = radii[radii.length - 1] + pad;
    for (let i = 0; i < N; i++) { const th = -Math.PI / 2 + (Math.PI / 2) * i / N; pts.push(new THREE.Vector2(r0 * Math.cos(th), -half + r0 * Math.sin(th))); }
    if (cut < 1) {
      for (let i = 0; i <= 12; i++) pts.push(curve.getPoint(cut * i / 12));
      const e = pts[pts.length - 1]; pts.push(new THREE.Vector2(e.x - pad - 0.004, e.y + 0.001));      // 袖口向里收, 贴住手臂
    } else {
      pts.push(...curve.getPoints(20));
      for (let i = 1; i <= N; i++) { const th = (Math.PI / 2) * i / N; pts.push(new THREE.Vector2(r1 * Math.cos(th), half + r1 * Math.sin(th))); }
    }
    return new THREE.LatheGeometry(pts, 24).rotateX(Math.PI / 2);
  });
}
// 把一圈圈的点(每圈点数相同)依次连成一张封闭的皮, 两头用扇形封口。索引的顺序: 第一圈的封口, 各圈之间的带子, 最后一圈的封口
function loftGeo(rings) {
  const n = rings[0].length, K = rings.length, pos = [], idx = [];
  for (const r of rings) for (const p of r) pos.push(p.x, p.y, p.z);
  const mid = (r) => { const c = new THREE.Vector3(); for (const p of r) c.add(p); c.divideScalar(n); pos.push(c.x, c.y, c.z); return pos.length / 3 - 1; };
  const c0 = mid(rings[0]), c1 = mid(rings[K - 1]);
  for (let i = 0; i < n; i++) idx.push(c0, i, (i + 1) % n);
  for (let k = 0; k + 1 < K; k++) for (let i = 0; i < n; i++) { const a = k * n + i, b = k * n + (i + 1) % n; idx.push(a, a + n, b, b, a + n, b + n); }
  for (let i = 0; i < n; i++) idx.push(c1, (K - 1) * n + (i + 1) % n, (K - 1) * n + i);
  const P = (i) => new THREE.Vector3(pos[i * 3], pos[i * 3 + 1], pos[i * 3 + 2]);
  let vol = 0;                                       // 圈的绕向反了整张皮会里外翻转: 用体积的正负检查, 反了就把每个三角形翻过来
  for (let i = 0; i < idx.length; i += 3) vol += P(idx[i]).dot(P(idx[i + 1]).cross(P(idx[i + 2])));
  if (vol < 0) for (let i = 0; i < idx.length; i += 3) [idx[i + 1], idx[i + 2]] = [idx[i + 2], idx[i + 1]];
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  return g;
}
// 躯干: 从脖子根到裆部的一张皮(绑定姿势, 躯干坐标系), 横截面是略方的椭圆。材质分两组: 0 = 衣服(到下摆), 1 = 裤子。
// 每个顶点按高度把权重分给 torso / waist_lower / pelvis, 过渡区正好跨在两个腰部关节上, 弯腰扭腰时是平滑弯过去的
function torsoGeo(L) {
  return memo('torso', () => {
    const zTop = 0.078, zc = 0.07 - L.chestHeight, zw = -0.26, zh = -0.425, zBot = -0.535, zHem = -0.345, N = 32, E = 0.82;
    const shape = (z) => {                           // 这个高度上的 [半宽, 半厚, 中心的 x]
      if (z >= zc) { const f = Math.sqrt(Math.max(1 - ((z - zc) / (zTop - zc)) ** 2, 0)); return [L.chestWidth * f, L.chestDepth * f, -0.005]; }
      if (z >= zw) { const t = smooth(zc, zw, z); return [lerp(L.chestWidth, L.waistWidth, t), lerp(L.chestDepth, 0.088, t), lerp(-0.005, -0.01, t)]; }
      if (z >= zh) { const t = smooth(zw, zh, z); return [lerp(L.waistWidth, L.hipWidth, t), lerp(0.088, 0.106, t), lerp(-0.01, -0.03, t)]; }
      const f = Math.sqrt(Math.max(1 - ((zh - z) / (zh - zBot)) ** 2, 0)); return [L.hipWidth * f, 0.106 * f, -0.03];
    };
    const zs = [];
    for (let i = 0; i < 7; i++) zs.push(zc + (zTop - zc) * Math.sin((80 - 80 * i / 6) * D2R));      // 胸腔顶部的圆顶
    for (let i = 1; i <= 8; i++) zs.push(lerp(zc, zh, i / 8));
    for (let i = 1; i <= 5; i++) zs.push(zh - (zh - zBot) * Math.sin(16 * i * D2R));                 // 胯底收口
    const rings = [], ring = (z, grow) => rings.push(Array.from({ length: N }, (_, i) => {
      const th = 2 * Math.PI * i / N, c = Math.cos(th), s = Math.sin(th), [ry, rx, cx] = shape(z);
      return new THREE.Vector3(cx + (rx + grow) * Math.sign(c) * Math.abs(c) ** E, (ry + grow) * Math.sign(s) * Math.abs(s) ** E, z);
    }));
    let hemAt = 0;
    for (const z of zs) {
      if (!hemAt && z < zHem + 0.012) { ring(zHem, 0.008); hemAt = rings.length; ring(zHem - 0.002, 0); }   // 衣服下摆比裤腰大一圈, 形成一个小台阶
      if (Math.abs(z - zHem) >= 0.012) ring(z, hemAt ? 0 : 0.008 * smooth(zHem + 0.09, zHem, z));
    }
    const g = loftGeo(rings), nShirt = N * 3 + hemAt * N * 6, pa = g.attributes.position, si = [], sw = [];
    g.addGroup(0, nShirt, 0); g.addGroup(nShirt, g.index.count - nShirt, 1);
    for (let i = 0; i < pa.count; i++) {
      const z = pa.getZ(i), wT = 1 - smooth(-0.15, -0.24, z), wP = smooth(-0.29, -0.36, z);
      si.push(0, 1, 2, 0); sw.push(wT, 1 - wT - wP, wP, 0);
    }
    g.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(si, 4)); g.setAttribute('skinWeight', new THREE.Float32BufferAttribute(sw, 4));
    return g;
  });
}
// 鞋(脚坐标系: x 朝前, 鞋底贴着物理的脚底 z = -0.027)。从鞋尖到鞋跟一圈圈连起来; sole = true 时是鞋底那一片
function shoeGeo(fs, sole) {
  return memo(`shoe${fs}|${sole}`, () => {
    const ST = [[0.158, 0.014, 0.012], [0.148, 0.032, 0.024], [0.122, 0.048, 0.034], [0.082, 0.054, 0.043], [0.04, 0.053, 0.058],
                [0, 0.049, 0.076], [-0.04, 0.046, 0.082], [-0.07, 0.041, 0.074], [-0.09, 0.03, 0.056], [-0.098, 0.014, 0.03]];   // [x, 半宽, 鞋面高]
    const N = 20, x0 = 0.03, z0 = -0.027;            // 放大缩小时 (x0, z0) 不动, 鞋底始终踩在地上
    return loftGeo(ST.map(([x, w, h]) => Array.from({ length: N }, (_, i) => {
      const th = 2 * Math.PI * i / N, c = Math.cos(th), s = Math.sin(th);
      const y = sole ? (w + 0.005) * Math.sign(c) * Math.sqrt(Math.abs(c)) : w * c;
      const z = sole ? 0.011 + 0.011 * Math.sign(s) * Math.sqrt(Math.abs(s)) : 0.016 + (s > 0 ? h : 0.012) * s;
      return new THREE.Vector3(x0 + (x - x0) * fs * (sole ? 1.03 : 1), y * fs, z0 + z * fs);   // 鞋底比鞋面长一点, 两头的封口才不会叠在同一个平面上闪烁
    })));
  });
}

// ---------- 装载与布局 ----------
function clearRuns() {
  for (const r of runs) {
    mj.remove(r.group);
    for (const W of r.worlds) { for (const m of Object.values(W.mats)) m.dispose(); W.skel.dispose(); W.trail.geometry.dispose(); W.trail.material.dispose(); }
  }
  for (const g of GEO.values()) g.dispose();
  GEO = new Map();
  while (deco.children.length) {
    const o = deco.children[0]; deco.remove(o);
    if (!o.isSprite) o.geometry?.dispose();
    o.material?.map?.dispose(); o.material?.dispose();
  }
  runs = [];
}

let currentLanes = 6;
function frameCamera(totalLanes) {
  currentLanes = totalLanes;
  const zMid = LANE * (totalLanes - 1) / 2, span = Math.max(LANE * totalLanes, 4), extra = Math.max(0, totalLanes - 7);
  controls.target.set(2, 0.9, zMid);                       // 跑道多的时候(对比模式)镜头抬高、后退, 才能看清远处的道
  camera.position.set(3.2 + span * 0.12, 1.9 + span * 0.16 + extra * 0.7, zMid + 5.2 + span * 0.55 + extra * 0.8);
  controls.update();
}

let showToken = 0;                                  // 只认最后一次 show(): 加载是异步的, 前一次没完成时又来新的要作废
async function show(files) {
  const my = ++showToken;
  if (!files.length) return;
  const datas = await Promise.all(files.map(loadRun));
  for (const d of datas) if (d.timeline) {           // 默认最后一个快照; 链接里给了 it=轮数 就取最接近的
    const i = d.snapIdx >= 0 ? d.snapIdx : params.has('it') ? nearestSnap(d, +params.get('it')) : d.snaps.length - 1;
    d.worlds = await loadSnap(d, i); d.snapIdx = i;
  }
  if (my !== showToken) return;                      // 等待期间用户又选了别的, 这一次作废
  clearRuns(); selected = files;
  let lanes = 0, built = [];
  for (const data of datas) {
    const r = buildRun(data, built.length, lanes);
    built.push(r); lanes += r.nLanes + (files.length > 1 ? 1 : 0);       // 对比时,不同阶段之间空一条跑道
  }
  if (files.length > 1) lanes -= 1;
  runs = built;
  // 跑道底色条、起跑线、距离标记、阶段名牌
  const length = 160;
  runs.forEach((r) => {
    for (let k = 0; k < r.nLanes; k++) {
      const z = (r.laneStart + k) * LANE;
      const strip = new THREE.Mesh(new THREE.PlaneGeometry(length, LANE * 0.94).rotateX(-Math.PI / 2),
        new THREE.MeshStandardMaterial({ color: r.runIdx % 2 ? 0xb9855a : 0xc59a6d, roughness: 0.95 }));
      strip.position.set(length / 2 - 8, 0.004, z); strip.receiveShadow = true; deco.add(strip);
    }
    r.tag = null; putTag(r);
  });
  const zc = LANE * (lanes - 1) / 2;
  const line = new THREE.Mesh(new THREE.PlaneGeometry(0.12, LANE * lanes).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  line.position.set(0, 0.008, zc); deco.add(line);
  for (let m = 5; m <= 150; m += 5) {
    const tick = new THREE.Mesh(new THREE.PlaneGeometry(0.07, LANE * lanes).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xfff2d6, transparent: true, opacity: 0.55 }));
    tick.position.set(m, 0.007, zc); deco.add(tick);
    const s = textSprite(m + ' m', '#ffffff', 52); s.position.set(m, 0.45, -LANE * 0.95); s.scale.set(1.6, 0.4, 1); deco.add(s);
  }
  total = Math.max(...runs.map((r) => r.dur));
  buildSide();
  frameCamera(lanes);
  time = 0;
  if (params.has('t')) time = Math.min(+params.get('t'), total);
  document.querySelectorAll('#runs label').forEach((l) => {            // 勾选状态和当前显示保持一致
    const on = files.includes(l.dataset.file); l.classList.toggle('on', on); l.querySelector('input').checked = on;
  });
  syncTimelineBar();
  for (const r of runs) if (r.data.timeline) prefetch(r.data);
}

// ---------- 时间线: 轮数滑块 ----------
function nearestSnap(d, it) { let b = 0; d.snaps.forEach((s, i) => { if (Math.abs(s.it - it) < Math.abs(d.snaps[b].it - it)) b = i; }); return b; }
const tlRuns = () => runs.filter((r) => r.data.timeline);
function syncTimelineBar() {
  const tl = tlRuns(); $('tl').hidden = !tl.length;
  if (!tl.length) return;
  const d = tl[0].data, s = d.snaps[d.snapIdx];
  $('tlScrub').max = d.snaps.length - 1;
  if (document.activeElement !== $('tlScrub')) $('tlScrub').value = d.snapIdx;
  const dead = s.worlds.filter((w) => w.fell).length;
  $('tlInfo').innerHTML = `<b>第 ${s.it} 轮</b> · ${s.run} · ${d.snapIdx + 1}/${d.snaps.length}` + (dead ? ` · 摔 ${dead}/${s.worlds.length}` : '');
}
let iterToken = 0;
async function setIter(i) {                          // 第一条时间线换到第 i 个快照, 其他时间线取轮数最接近的
  const tl = tlRuns(); if (!tl.length) return;
  const d0 = tl[0].data; i = Math.max(0, Math.min(d0.snaps.length - 1, i));
  const it = d0.snaps[i].it, my = ++iterToken;
  const picks = tl.map((r, k) => (k === 0 ? i : nearestSnap(r.data, it)));
  const loaded = await Promise.all(tl.map((r, k) => loadSnap(r.data, picks[k])));
  if (my !== iterToken) return;                      // 拖得快, 只认最后一次
  tl.forEach((r, k) => {
    setWorlds(r, loaded[k], picks[k]); putTag(r);
    for (const W of r.worlds) if (W.el) W.el.querySelector('.nm').textContent = `${r.label} · 道 ${W.lane - r.laneStart + 1}`;
  });
  syncTimelineBar();
}
$('tlScrub').oninput = (e) => setIter(+e.target.value).catch(fail);
$('tlPrev').onclick = () => setIter(tlRuns()[0].data.snapIdx - 1).catch(fail);
$('tlNext').onclick = () => setIter(tlRuns()[0].data.snapIdx + 1).catch(fail);

function buildSide() {
  const side = $('side'); side.innerHTML = '';
  for (const r of runs) for (const W of r.worlds) {
    const el = document.createElement('div'); el.className = 'lane';
    el.innerHTML = `<span class="chip" style="background:#${W.shirt.toString(16).padStart(6, '0')}"></span><span class="nm">${r.label} · 道 ${W.lane - r.laneStart + 1}</span><span class="st">0.0 m</span>`;
    W.el = el; W.stEl = el.querySelector('.st'); side.appendChild(el);
  }
}

// ---------- 界面 ----------
function buildPicker() {
  const box = $('runs'); box.innerHTML = '';
  for (const e of index) {
    const l = document.createElement('label'); l.dataset.file = e.file;
    l.innerHTML = `<input type="checkbox"><span>${e.label}</span>` + (e.timeline ? '<span class="tlmark">· 轮数可拖</span>' : '');
    l.querySelector('input').addEventListener('change', () => {
      const on = [...box.querySelectorAll('label')].filter((x) => x.querySelector('input').checked).map((x) => x.dataset.file);
      show(on.length ? on : [e.file]).catch(fail);
    });
    box.appendChild(l);
  }
}
function fail(err) { const m = $('msg'); m.style.display = 'grid'; m.textContent = String(err.message || err); console.error(err); }

$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? '暂停' : '播放'; };
$('scrub').oninput = (e) => { time = (e.target.value / 1000) * total; };
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); $('play').click(); }
  else if (e.code === 'ArrowLeft') time = Math.max(0, time - 0.25);
  else if (e.code === 'ArrowRight') time = Math.min(total, time + 0.25);
  else if ((e.code === 'ArrowUp' || e.code === 'ArrowDown') && tlRuns().length) { e.preventDefault(); setIter(tlRuns()[0].data.snapIdx + (e.code === 'ArrowUp' ? 1 : -1)).catch(fail); }
});
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

// ---------- 镜头按钮 ----------
function closeUp() {                                 // 镜头对准第一个人, 方便看细节(想定格就按空格暂停)
  const W = runs[0]?.worlds[0]; if (!W) return;
  const p = new THREE.Vector3(); W.bodyObjs[1].getWorldPosition(p);
  controls.target.set(p.x, 1.05, p.z);
  camera.position.set(p.x + 1.6, 1.3, p.z - 2.2);
  controls.update();
}
$('closeup').onclick = closeUp;
$('wide').onclick = () => frameCamera(currentLanes);

// ---------- 主循环 ----------
let last = performance.now();
const followTarget = new THREE.Vector3(), tmpV = new THREE.Vector3();
function tick(now) {
  const dtReal = Math.min((now - last) / 1000, 0.1); last = now;
  if (runs.length) {
    if (playing) { time += dtReal * +$('speed').value; if (time > total + 1.2) time = 0; }
    const t = Math.min(time, total);
    let sx = 0, n = 0, ez = 0;
    for (const r of runs) for (const W of r.worlds) {
      const s = applyWorld(r, W, Math.min(time, r.dur + 99));
      const xs = W.w.xpos[s.p] - W.x0;
      if (W.el) { W.el.classList.toggle('out', s.out); W.stEl.textContent = xs.toFixed(1) + ' m'; }
      if (!s.out) { sx += W.w.xpos[s.p]; n++; }
    }
    if (n === 0) for (const r of runs) for (const W of r.worlds) { sx += W.w.xpos[(W.w.n - 1) * W.nb * 3 + 3]; n++; }
    followTarget.set(sx / n, 0.9, controls.target.z);
    if ($('cam').value === 'follow') {
      tmpV.copy(followTarget).sub(controls.target); tmpV.y = 0; tmpV.z = 0; tmpV.multiplyScalar(0.12);
      camera.position.add(tmpV); controls.target.add(tmpV);
    }
    if (document.activeElement !== $('scrub')) $('scrub').value = total ? (t / total) * 1000 : 0;
    $('time').textContent = `${t.toFixed(2)} / ${total.toFixed(2)} s`;
    ground.position.set(Math.round(controls.target.x / 4) * 4, 0, Math.round(controls.target.z / 4) * 4);
    sun.position.set(controls.target.x + 9, 16, controls.target.z + 6); sun.target.position.copy(controls.target);
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// ---------- 启动 ----------
try {
  const r = await fetch('replays/index.json?v=' + Date.now());
  if (!r.ok) throw new Error('找不到 replays/index.json, 请先运行 export.py 导出回放');
  index = (await r.json()).filter((e) => e.file !== 'probe.json');
  if (!index.length) throw new Error('replays/ 里还没有回放, 请先运行 export.py');
  buildPicker();
  const want = (params.get('r') || '').split(',').filter((f) => index.some((e) => e.file === f));
  await show(want.length ? want : [index[index.length - 1].file]);
  $('play').textContent = playing ? '暂停' : '播放';
} catch (e) { fail(e); }
window.__viewer = { get LOOK() { return LOOK; }, get time() { return time; }, set time(v) { time = v; }, get total() { return total; }, get runs() { return runs; }, setIter, THREE, camera, controls, scene };
</script>
</body>
